name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 也可以在 Actions 頁面手動執行

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署，不要取消正在進行的
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v6

      - name: 安裝 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安裝套件
        run: npm ci

      - name: 跑測試（沒過就不部署）
        run: npm test

      - name: 建置
        run: npm run build

      - name: 設定 Pages
        uses: actions/configure-pages@v5

      - name: 上傳成品
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
